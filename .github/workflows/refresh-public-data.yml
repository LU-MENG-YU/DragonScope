name: Refresh public intelligence

on:
  workflow_dispatch:
  # CPBL may block cloud data-center IPs. Enable cron only after manual runs work.
  # schedule:
  #   - cron: "17 22 * * *"  # 06:17 Asia/Taipei (UTC+8)

permissions:
  contents: write

concurrency:
  group: public-intelligence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install collector requirements
        run: python -m pip install -r requirements.txt
      - name: Refresh public data
        run: python collectors/run.py
      - name: Validate bundle
        run: |
          python -m unittest discover -s tests -v
          python tests/smoke_test.py
      - name: Commit only when data changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "wdragons-intel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: refresh public intelligence"
          git push
